  <script>
    /* myOperator behaviours: makes the static component markup interactive.

       so snippets from the reference files work without extra wiring. */
    (function () {

        var mradio = t.closest('[role="menuitemradio"]');
        if (mradio) {
          if (isOff(mradio)) return;
          all(mradio.closest('[role="group"]') || mradio.parentElement, '[role="menuitemradio"]').forEach(function (r) {
            r.setAttribute("aria-checked", String(r === mradio));
            setState(r, r === mradio ? "checked" : "unchecked");
          });
          return;
        }
        var mitem = t.closest("[data-popover-content] [role='menuitem']");
        if (mitem && !mitem.hasAttribute("aria-expanded")) {
          if (isOff(mitem)) return;
          setPopover(mitem.closest("[data-popover]"), false);
          return;
        }
    
        var dismiss = t.closest("[data-dismiss]");
        if (dismiss) {
          var target = dismiss.closest(dismiss.getAttribute("data-dismiss"));
          if (target) target.remove();
          return;
        }
    
        // View tabs: the active look is whatever classes the pressed button has and an
        // unpressed one lacks (read from the markup, so it tracks the component).
        var press = t.closest("[data-toggle-group] button[aria-pressed]");
        if (press) {
          if (isOff(press)) return;
          var btns = all(press.closest("[data-toggle-group]"), "button[aria-pressed]");
          var on3 = btns.filter(function (b) { return b.getAttribute("aria-pressed") === "true"; })[0];
          var off3 = btns.filter(function (b) { return b.getAttribute("aria-pressed") !== "true"; })[0];
          if (!on3 || !off3 || on3 === press) return;
          var onC = on3.className.split(/\s+/), offC = off3.className.split(/\s+/);
          var activeOnly = onC.filter(function (c) { return offC.indexOf(c) < 0; });
          var inactiveOnly = offC.filter(function (c) { return onC.indexOf(c) < 0; });
          btns.forEach(function (b) {
            var a = b === press;
            activeOnly.forEach(function (c) { b.classList.toggle(c, a); });
            inactiveOnly.forEach(function (c) { b.classList.toggle(c, !a); });
            b.setAttribute("aria-pressed", String(a));
          });
          return;
        }
    
        if (!t.closest("[data-popover]")) closePopovers();
      });
    
      function tip(e, show) {
        var w = e.target.closest && e.target.closest("[data-tooltip]");
        if (!w || (e.relatedTarget && w.contains(e.relatedTarget))) return;
        var c = w.querySelector("[data-tooltip-content]");
        if (c) { if (show) c.removeAttribute("hidden"); else c.setAttribute("hidden", ""); }
      }
      document.addEventListener("mouseover", function (e) { tip(e, true); });
      document.addEventListener("mouseout", function (e) { tip(e, false); });
      document.addEventListener("focusin", function (e) { tip(e, true); });
      document.addEventListener("focusout", function (e) { tip(e, false); });
    
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        closePopovers();
        all(document, "[data-dialog]").forEach(function (d) { d.setAttribute("hidden", ""); });
      });
    })();
  </script>
</body>
</html>
